name: Run EMSE security experiment

on:
  workflow_dispatch:
    inputs:
      run_type:
        description: "Pilot = 24 candidates; Full = 120 candidates"
        required: true
        default: pilot
        type: choice
        options:
          - pilot
          - full
      provider_a:
        description: "Provider for model A"
        required: true
        default: openai
        type: choice
        options:
          - openai
          - anthropic
      model_a:
        description: "API model ID for model A"
        required: true
        default: gpt-5.6-sol
        type: string
      provider_b:
        description: "Provider for model B"
        required: true
        default: openai
        type: choice
        options:
          - openai
          - anthropic
      model_b:
        description: "API model ID for model B"
        required: true
        default: gpt-5.6-terra
        type: string

permissions:
  contents: read

concurrency:
  group: emse-security-experiment-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  CODEQL_VERSION: "2.26.3"
  CODEQL_SHA256: "77e5be1b550d66662e600e795b6cf2ea1729e853e3dc79e02594f767039d2a29"

jobs:
  experiment:
    name: ${{ inputs.run_type }} experiment
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10.0.111
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.111
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Validate required provider secrets
        shell: bash
        run: |
          set -euo pipefail
          need_openai=false
          need_anthropic=false
          [[ "${{ inputs.provider_a }}" == "openai" || "${{ inputs.provider_b }}" == "openai" ]] && need_openai=true
          [[ "${{ inputs.provider_a }}" == "anthropic" || "${{ inputs.provider_b }}" == "anthropic" ]] && need_anthropic=true
          if [[ "$need_openai" == true && -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::error::Add repository secret OPENAI_API_KEY under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [[ "$need_anthropic" == true && -z "${ANTHROPIC_API_KEY:-}" ]]; then
            echo "::error::Add repository secret ANTHROPIC_API_KEY under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Cache CodeQL bundle
        id: codeql-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/codeql-${{ env.CODEQL_VERSION }}
          key: codeql-linux64-${{ env.CODEQL_VERSION }}-${{ env.CODEQL_SHA256 }}

      - name: Install pinned CodeQL CLI
        if: steps.codeql-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local"
          curl --fail --location --retry 4 --retry-delay 5 \
            "https://github.com/github/codeql-action/releases/download/codeql-bundle-v${CODEQL_VERSION}/codeql-bundle-linux64.tar.gz" \
            -o /tmp/codeql.tar.gz
          echo "${CODEQL_SHA256}  /tmp/codeql.tar.gz" | sha256sum --check --strict
          mkdir -p "$HOME/.local/codeql-${CODEQL_VERSION}"
          tar -xzf /tmp/codeql.tar.gz -C "$HOME/.local/codeql-${CODEQL_VERSION}" --strip-components=1

      - name: Put CodeQL on PATH
        shell: bash
        run: echo "$HOME/.local/codeql-${CODEQL_VERSION}" >> "$GITHUB_PATH"

      - name: Capture environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run-metadata
          {
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "GITHUB_SHA=${GITHUB_SHA}"
            echo "GITHUB_RUN_ID=${GITHUB_RUN_ID}"
            echo "GITHUB_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "RUN_TYPE=${{ inputs.run_type }}"
            echo "MODEL_A_PROVIDER=${{ inputs.provider_a }}"
            echo "MODEL_A=${{ inputs.model_a }}"
            echo "MODEL_B_PROVIDER=${{ inputs.provider_b }}"
            echo "MODEL_B=${{ inputs.model_b }}"
            dotnet --info
            git --version
            codeql version
          } | tee run-metadata/environment.txt

      - name: Preflight benchmark structure
        run: python3 scripts/preflight.py

      - name: Create run configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          EXPERIMENT_ID=$(python3 scripts/make-github-config.py \
            "${{ inputs.run_type }}" \
            "${{ inputs.provider_a }}" "${{ inputs.model_a }}" \
            "${{ inputs.provider_b }}" "${{ inputs.model_b }}" \
            "$(command -v codeql)" \
            config/experiment.github.json)
          echo "experiment_id=$EXPERIMENT_ID" >> "$GITHUB_OUTPUT"
          cp config/experiment.github.json run-metadata/experiment-config.json
          echo "Experiment ID: $EXPERIMENT_ID"

      - name: Restore experiment runner
        run: dotnet restore EMSE.SecurityExperiment.sln

      - name: Build experiment runner
        run: dotnet build EMSE.SecurityExperiment.sln -c Release --no-restore

      - name: Show experiment plan
        run: dotnet run -c Release --no-build --project src/ExperimentRunner -- plan config/experiment.github.json

      - name: Run experiment
        id: run
        shell: bash
        run: |
          set -o pipefail
          dotnet run -c Release --no-build --project src/ExperimentRunner -- run config/experiment.github.json 2>&1 | tee run-metadata/experiment.log

      - name: Aggregate results
        if: always()
        shell: bash
        run: |
          dotnet run -c Release --no-build --project src/ExperimentRunner -- aggregate config/experiment.github.json || true
          dotnet run -c Release --no-build --project src/ExperimentRunner -- blind-review config/experiment.github.json || true

      - name: Add provenance manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULT_DIR="results/${{ steps.config.outputs.experiment_id }}"
          mkdir -p "$RESULT_DIR"
          cp -r run-metadata "$RESULT_DIR/run-metadata"
          find "$RESULT_DIR" -type f -print0 | sort -z | xargs -0 sha256sum > "$RESULT_DIR/artifact-sha256.txt" || true

      - name: Upload complete research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emse-${{ inputs.run_type }}-${{ steps.config.outputs.experiment_id }}
          path: results/${{ steps.config.outputs.experiment_id }}/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Fail clearly if any candidate crashed
        if: always()
        shell: bash
        run: |
          FILE="results/${{ steps.config.outputs.experiment_id }}/run-failures.txt"
          if [[ -s "$FILE" ]]; then
            echo "::error::One or more candidates failed before producing a result. Download the artifact and inspect run-failures.txt."
            cat "$FILE"
            exit 1
          fi
